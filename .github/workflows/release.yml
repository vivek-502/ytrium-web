name: Release

# Publishes single-file binaries for Linux on every v* tag:
#   git tag v1.0.0 && git push origin v1.0.0
# Each platform job builds (and smoke-tests) the binary on its own runner,
# then attaches it plus a sha256 checksum to the GitHub release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          # ARM64 runners are free for public repositories.
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client

      # The output name follows the runner's architecture, so each job
      # produces ytrium-web-linux-<arch> for its own platform.
      - name: Build & smoke-test the binary
        run: npm run build:bin

      - name: Checksum
        working-directory: dist-bin
        run: sha256sum ytrium-web-linux-${{ matrix.arch }} > ytrium-web-linux-${{ matrix.arch }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ytrium-web-linux-${{ matrix.arch }}
          path: |
            dist-bin/ytrium-web-linux-${{ matrix.arch }}
            dist-bin/ytrium-web-linux-${{ matrix.arch }}.sha256

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-bin/ytrium-web-linux-${{ matrix.arch }}
            dist-bin/ytrium-web-linux-${{ matrix.arch }}.sha256
          generate_release_notes: true
